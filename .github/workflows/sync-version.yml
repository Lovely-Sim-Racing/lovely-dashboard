# Keeps version.json in step with the Lovely API (https://api.lsr.gg/version).
#
# Plugins older than October 2025 still read version.json from this repo's main branch to find the latest plugin and
# dashboards. The API is the source of truth, so this copies it here: every hour, or on demand (Actions > Sync
# version.json > Run workflow). It commits only when a version or link actually changed.
#
# Scheduled workflows only run on the default branch (main), and GitHub disables them after 60 days without activity
# in the repo. If the Actions tab says this workflow is disabled, re-enable it there.
name: Sync version.json

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-version
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # main is protected, so the built-in token can't push to it. VERSION_SYNC_TOKEN is a fine-grained token from a
      # repo admin (Contents: read and write, this repo only), saved under Settings > Secrets and variables > Actions.
      # It expires: when the push step fails with an auth error, make a new one and replace the secret.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.VERSION_SYNC_TOKEN || github.token }}

      - name: Fetch the API's versions
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            -A 'lovely-dashboard-version-sync' -o /tmp/version.json https://api.lsr.gg/version
          # Never commit an error page or a partial answer: it must be JSON with the plugin's version and link
          jq -e '(.LovelyPlugin | type == "string") and (.LovelyPluginURL | type == "string") and (length > 10)' \
            /tmp/version.json > /dev/null

      - name: Commit when it changed
        run: |
          if [ -f version.json ] && jq -e --slurpfile api /tmp/version.json '. == $api[0]' version.json > /dev/null; then
            echo "version.json is up to date ($(jq -r .LovelyPlugin version.json))"
            exit 0
          fi
          jq . /tmp/version.json > version.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json
          git commit -m "version.json: sync from api.lsr.gg (plugin $(jq -r .LovelyPlugin version.json), dashboards $(jq -r .LovelyDashboard version.json))"
          git push
